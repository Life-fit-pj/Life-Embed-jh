name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # DB·API 키 없이 도는 검사만 한다. 키는 import 시점 확인(app/core/config.py)만 넘기는 가짜 값이다
    env:
      DATABASE_URL: postgresql+psycopg://ci:ci@127.0.0.1:1/ci
      ANTHROPIC_API_KEY: ci
      OPENAI_API_KEY: ci
      SUPABASE_URL: http://127.0.0.1:1
      SUPABASE_SERVICE_ROLE_KEY: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      # 빼는 다섯 파일은 Supabase DB·인증 서버에 실제로 붙는다. 로컬에서 py -m pytest tests 로 돌린다
      - run: >
          python -m pytest tests -q
          --ignore=tests/test_db.py
          --ignore=tests/test_models.py
          --ignore=tests/test_golden.py
          --ignore=tests/test_vector_search.py
          --ignore=tests/test_supabase_auth.py
      - run: bash check.sh
